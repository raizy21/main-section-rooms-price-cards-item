<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>section-rooms</title>
    <!-- fav_icon  -->
    <link rel="icon" type="image/png" href="images/favicon.png" />

    <!-- font awesome -->
    <script
      src="https://kit.fontawesome.com/2191fb3337.js"
      crossorigin="anonymous"
    ></script>

    <!-- css -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- rooms -->
    <section class="rooms">
      <!-- 1 item flexbox -->
      <div class="common-header">
        <h1 class="common-heading">Rooms in Grand Hotel</h1>
        <div class="underline">
          <div class="small-underline"></div>
          <div class="big-underline"></div>
        </div>
      </div>

      <!-- 2 item flexbox -->
      <div class="rooms-cards-wrapper">
        <!-- item 1 -->
        <div class="room-card">
          <img
            src="images/single-rooms.avif"
            alt="single-rooms"
            class="room-img"
          />
          <div class="room-card-content">
            <h4 class="room-card-heading">Single Room</h4>
            <p class="room-card-paragraph">Lorem ipsum dolor sit amet.</p>
            <p class="room-price">$99.9</p>
            <button class="room-card-btn">
              Book now<i class="fa-solid fa-check btn-arrow"></i>
            </button>
          </div>
        </div>
        <!-- end of item 1 -->

        <!-- item 2 -->
        <div class="room-card">
          <img
            src="images/double-rooms.webp"
            alt="single-rooms"
            class="room-img"
          />
          <div class="room-card-content">
            <h4 class="room-card-heading">Double Room</h4>
            <p class="room-card-paragraph">Lorem ipsum dolor sit amet.</p>
            <p class="room-price">$199.9</p>
            <button class="room-card-btn">
              Book now<i class="fa-solid fa-check btn-arrow"></i>
            </button>
          </div>
        </div>
        <!-- end of item 2 -->
        <!-- item 3 -->
        <div class="room-card">
          <img
            src="images/lux-rooms.avif"
            alt="single-rooms"
            class="room-img"
          />
          <div class="room-card-content">
            <h4 class="room-card-heading">Lux</h4>
            <p class="room-card-paragraph">Lorem ipsum dolor sit amet.</p>
            <p class="room-price">$299.9</p>
            <button class="room-card-btn">
              Book now<i class="fa-solid fa-check btn-arrow"></i>
            </button>
          </div>
        </div>
        <!-- end of item 3 -->
        <!-- item 4 -->

        <div class="room-card">
          <img
            src="images/vip-rooms.avif"
            alt="single-rooms"
            class="room-img"
          />
          <div class="room-card-content">
            <h4 class="room-card-heading">VIP Room</h4>
            <p class="room-card-paragraph">Lorem ipsum dolor sit amet.</p>
            <p class="room-price">$399.9</p>
            <button class="room-card-btn">
              Book now<i class="fa-solid fa-check btn-arrow"></i>
            </button>
          </div>
        </div>
        <!-- end of item 4 -->
      </div>

      <!-- 3 item flexbox -->
      <div class="rooms-btn-wrapper">
        <button class="rooms-btn">Check All Rooms<i class="fa-solid fa-check btn-arrow"></i></button>
      </div>
    </section>

    <!-- end of rooms -->
  </body>
</html>
